<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OH Perfect Week</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14202b;--mute:#6b7885;--line:#e1e6ea;--accent:#1b6b3a;--win:#1b8a4b;--loss:#c0392b;--sel:#e3f4ea}
@media(prefers-color-scheme:dark){:root{--bg:#0f1519;--card:#18212a;--ink:#e8eef3;--mute:#8d9aa6;--line:#2a3640;--accent:#3fb26f;--win:#3fb26f;--loss:#e5675a;--sel:#173626}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif}
header{background:var(--accent);color:#fff;padding:14px 16px}
header h1{margin:0;font-size:20px}
main{max-width:900px;margin:0 auto;padding:16px}
nav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
nav button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on,.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;overflow-x:auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
select,input{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.game{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:12px}
.game .meta{grid-column:1/-1;color:var(--mute);font-size:13px}
.team{padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-align:center}
.team.sel{border-color:var(--accent);background:var(--sel)}
.team.right{border-color:var(--win)}.team.wrong{border-color:var(--loss)}
.team:disabled{cursor:default;opacity:.9}
.at{color:var(--mute);font-size:13px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--mute)}
td.ok{color:var(--win);font-weight:700}td.no{color:var(--loss);font-weight:700}td.none{color:var(--mute)}
.mute{color:var(--mute);font-size:14px}
.num{text-align:right}
</style>
</head>
<body>
<header><h1>🏈 OH Perfect Week</h1></header>
<main>
  <nav id="nav"></nav>
  <div id="view"></div>
</main>
<script>
const LKEY='pickem-local-v1';
const API='/api/storage';
const SKEY='pickem';
// Shared (server): players, games, picks. Local (this device): room, me, tab, week.
let S={players:[],games:[],picks:{},room:'',week:1,me:'',tab:'picks'};
let raw=null,status='';
try{const l=JSON.parse(localStorage.getItem(LKEY)||'{}');for(const k of['room','me','tab','week'])if(l[k]!==undefined)S[k]=l[k]}catch(e){}
const h=(location.hash||'').replace('#','').toUpperCase();if(/^[A-Z0-9]{4,12}$/.test(h))S.room=h;
const saveLocal=()=>{try{localStorage.setItem(LKEY,JSON.stringify({room:S.room,me:S.me,tab:S.tab,week:S.week}))}catch(e){}};
const save=saveLocal;
const apiUrl=()=>`${API}?room=${encodeURIComponent(S.room)}&key=${SKEY}`;
function adopt(r){raw=r;const d=r?JSON.parse(r):{};S.players=d.players||[];S.games=d.games||[];S.picks=d.picks||{}}
async function load(){
  const res=await fetch(apiUrl());if(!res.ok)throw new Error('Server error '+res.status);
  const {value}=await res.json();
  if(value===raw)return false;adopt(value);return true;
}
// Apply fn to the latest shared data and write with compare-and-set; retry on conflict.
async function mutate(fn){
  for(let i=0;i<6;i++){
    const d=raw?JSON.parse(raw):{players:[],games:[],picks:{}};
    d.players??=[];d.games??=[];d.picks??={};
    fn(d);
    const next=JSON.stringify(d);
    const res=await fetch(apiUrl(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:next,expected:raw})});
    if(res.ok){adopt(next);status='';render();return}
    if(res.status===409){adopt((await res.json()).current);continue}
    status='Could not save ('+res.status+')';render();return;
  }
  status='Too many conflicting edits — try again.';render();
}
async function enterRoom(code,create){
  S.room=code;location.hash=code;saveLocal();raw=null;
  try{
    if(create)await mutate(()=>{});else{await load();if(raw===null){status='No room with that code.';S.room='';location.hash='';saveLocal()}}
  }catch(e){status='Cannot reach the server. ('+e.message+')';S.room=''}
  render();
}
setInterval(async()=>{
  if(!S.room||document.hidden)return;
  const a=document.activeElement;if(a&&(a.tagName=='INPUT'))return;
  try{if(await load())render()}catch(e){}
},5000);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const weeks=()=>{const w=new Set([1,...S.games.map(g=>g.week)]);return [...w].sort((a,b)=>a-b)};
const weekGames=()=>S.games.filter(g=>g.week==S.week);
const isLocked=g=>!!g.winner||(g.kickoff&&new Date(g.kickoff)<=new Date());

function stats(){
  const r=S.players.map(p=>({name:p,w:0,l:0}));
  for(const g of S.games){
    if(!g.winner)continue;
    for(const x of r){const pk=(S.picks[g.id]||{})[x.name];if(!pk)x.l++;else if(pk===g.winner)x.w++;else x.l++}
  }
  r.forEach(x=>{x.pct=x.w+x.l?x.w/(x.w+x.l):0});
  return r.sort((a,b)=>b.pct-a.pct||b.w-a.w||a.name.localeCompare(b.name));
}

function vLobby(){
  $('#nav').innerHTML='';
  $('#view').innerHTML=`<div class="card"><b>Start a new league</b><p class="mute">Creates a room with a code your friends can use on their own phones.</p><button class="btn primary" id="cr">Create room</button></div>
  <div class="card"><b>Join a league</b><div class="row" style="margin:8px 0 0"><input id="jc" placeholder="Room code" maxlength="12" style="text-transform:uppercase"><button class="btn primary" id="jr">Join</button></div></div>
  ${status?`<p style="color:var(--loss)">${esc(status)}</p>`:''}`;
  $('#cr').onclick=()=>{status='';enterRoom(Math.random().toString(36).slice(2,8).toUpperCase().padEnd(6,'X'),true)};
  $('#jr').onclick=()=>{const c=$('#jc').value.trim().toUpperCase();if(/^[A-Z0-9]{4,12}$/.test(c)){status='';enterRoom(c,false)}};
}
const tabs=[['picks','Make Picks'],['all','Everyone\'s Picks'],['rank','Standings'],['admin','Games & Setup']];
function render(){
  if(!S.room){vLobby();return}
  $('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${S.tab==k?'on':''}" data-t="${k}">${l}</button>`).join('');
  $('#nav').onclick=e=>{const t=e.target.dataset.t;if(t){S.tab=t;save();render()}};
  ({picks:vPicks,all:vAll,rank:vRank,admin:vAdmin})[S.tab]();
  $('#view').insertAdjacentHTML('afterbegin',`<p class="mute" style="margin:0 0 10px">Room <b>${esc(S.room)}</b> · share this page's link to invite players ${status?`· <span style="color:var(--loss)">${esc(status)}</span>`:''} <a href="#" id="lv">leave</a></p>`);
  $('#lv').onclick=e=>{e.preventDefault();S.room='';raw=null;location.hash='';saveLocal();render()};
}
function weekBar(){
  return `<div class="row"><label>Week <select id="wk">${weeks().map(w=>`<option ${w==S.week?'selected':''}>${w}</option>`).join('')}</select></label></div>`;
}
function bindWeek(){const e=$('#wk');if(e)e.onchange=()=>{S.week=+e.value;save();render()}}

function vPicks(){
  if(!S.players.length){$('#view').innerHTML=`<div class="card">Add players first on the <b>Games & Setup</b> tab.</div>`;return}
  if(!S.players.includes(S.me))S.me=S.players[0];
  const gs=weekGames();
  $('#view').innerHTML=weekBar().replace('</div>',`<label>Player <select id="me">${S.players.map(p=>`<option ${p==S.me?'selected':''}>${esc(p)}</option>`).join('')}</select></label></div>`)+
  (gs.length?gs.map(g=>{
    const pk=(S.picks[g.id]||{})[S.me],lock=isLocked(g);
    const cls=t=>{let c=pk==t?'sel':'';if(g.winner&&pk==t)c=pk==g.winner?'sel right':'sel wrong';return c};
    return `<div class="card game"><div class="meta">${g.kickoff?new Date(g.kickoff).toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'}):'No kickoff set'}${g.winner?` · Final: ${esc(g.winner)} won`:lock?' · Locked':''}</div>
      <button class="team ${cls(g.away)}" data-g="${g.id}" data-t="${esc(g.away)}" ${lock?'disabled':''}>${esc(g.away)}</button><span class="at">at</span>
      <button class="team ${cls(g.home)}" data-g="${g.id}" data-t="${esc(g.home)}" ${lock?'disabled':''}>${esc(g.home)}</button></div>`}).join(''):`<div class="card mute">No games this week yet. Add some on the Games & Setup tab.</div>`);
  bindWeek();
  $('#me').onchange=e=>{S.me=e.target.value;save();render()};
  $('#view').onclick=e=>{const b=e.target.closest('.team');if(!b||b.disabled)return;
    const g=b.dataset.g,t=b.dataset.t,me=S.me;mutate(d=>{(d.picks[g]??={})[me]=t})};
}

function vAll(){
  const gs=weekGames();
  $('#view').innerHTML=weekBar()+(gs.length&&S.players.length?`<div class="card"><table><thead><tr><th>Game</th>${S.players.map(p=>`<th>${esc(p)}</th>`).join('')}</tr></thead><tbody>${gs.map(g=>{
    const hide=!isLocked(g);
    return `<tr><td>${esc(g.away)} @ ${esc(g.home)}${g.winner?`<div class="mute">W: ${esc(g.winner)}</div>`:''}</td>${S.players.map(p=>{
      const pk=(S.picks[g.id]||{})[p];
      if(!pk)return `<td class="none">–</td>`;
      if(hide)return `<td class="none">🔒 picked</td>`;
      return `<td class="${g.winner?(pk==g.winner?'ok':'no'):''}">${esc(pk)}</td>`}).join('')}</tr>`}).join('')}</tbody></table></div>
    <p class="mute">Picks stay hidden until a game locks (kickoff or final).</p>`:`<div class="card mute">Nothing to show yet.</div>`);
  bindWeek();
}

function vRank(){
  const r=stats();
  $('#view').innerHTML=`<div class="card">${r.length?`<table><thead><tr><th>#</th><th>Player</th><th class="num">W</th><th class="num">L</th><th class="num">Win %</th></tr></thead><tbody>${r.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.name)}</b></td><td class="num">${x.w}</td><td class="num">${x.l}</td><td class="num">${(x.pct*100).toFixed(1)}%</td></tr>`).join('')}</tbody></table>`:'<span class="mute">No players yet.</span>'}</div>
  <p class="mute">Ranked by win %, then total wins. A missed pick on a finished game counts as a loss.</p>`;
}

function vAdmin(){
  const gs=weekGames();
  $('#view').innerHTML=`<div class="card"><b>Players</b><div class="row" style="margin-top:8px"><input id="np" placeholder="Player name"><button class="btn primary" id="ap">Add</button></div>
    <div>${S.players.map(p=>`<span class="btn" style="display:inline-block;margin:0 6px 6px 0">${esc(p)} <a href="#" data-rp="${esc(p)}" style="color:var(--loss);text-decoration:none">✕</a></span>`).join('')||'<span class="mute">None yet</span>'}</div></div>
  ${weekBar()}
  <div class="card"><b>Add game (Week ${S.week})</b><div class="row" style="margin-top:8px"><input id="ga" placeholder="Away team" size="12"><input id="gh" placeholder="Home team" size="12"><input id="gk" type="datetime-local"><button class="btn primary" id="ag">Add</button></div>
    <div class="row"><input id="nw" type="number" min="1" placeholder="New week #" style="width:120px"><button class="btn" id="aw">Go to week</button></div></div>
  ${gs.map(g=>`<div class="card"><b>${esc(g.away)} @ ${esc(g.home)}</b><div class="row" style="margin:8px 0 0"><span class="mute">Winner:</span>
    <select data-w="${g.id}"><option value="">— not final —</option><option ${g.winner==g.away?'selected':''}>${esc(g.away)}</option><option ${g.winner==g.home?'selected':''}>${esc(g.home)}</option></select>
    <button class="btn" data-dg="${g.id}">Delete</button></div></div>`).join('')}`;
  bindWeek();
  $('#ap').onclick=()=>{const v=$('#np').value.trim();if(v&&!S.players.includes(v))mutate(d=>{if(!d.players.includes(v))d.players.push(v)})};
  $('#np').onkeydown=e=>{if(e.key=='Enter')$('#ap').click()};
  $('#ag').onclick=()=>{const a=$('#ga').value.trim(),h=$('#gh').value.trim();if(!a||!h)return;
    const gm={id:uid(),week:S.week,away:a,home:h,kickoff:$('#gk').value||'',winner:''};mutate(d=>{d.games.push(gm)})};
  $('#aw').onclick=()=>{const w=+$('#nw').value;if(w>0){S.week=w;save();render()}};
  $('#view').onclick=e=>{
    const rp=e.target.dataset.rp;if(rp!==undefined){e.preventDefault();if(confirm('Remove '+rp+' and their picks?'))mutate(d=>{d.players=d.players.filter(p=>p!=rp);for(const k in d.picks)delete d.picks[k][rp]})}
    const dg=e.target.dataset.dg;if(dg&&confirm('Delete this game?'))mutate(d=>{d.games=d.games.filter(g=>g.id!=dg);delete d.picks[dg]})};
  $('#view').onchange=e=>{const w=e.target.dataset.w;if(w){const v=e.target.value;mutate(d=>{const g=d.games.find(g=>g.id==w);if(g)g.winner=v})}};
}
if(S.room)enterRoom(S.room,false);else render();
</script>
</body>
</html>
